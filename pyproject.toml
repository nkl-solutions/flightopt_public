[project]
name = "flightopt"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "curl-cffi>=0.16.3",
    "fastapi>=0.141.1",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
# Nur fuer den Booking-Adapter, und der ist ohnehin hinter einem Schalter.
# Playwright zieht einen Browser nach, den weder das Image noch die Testsuite
# braucht: `uv sync --frozen --no-dev` im Dockerfile laesst diese Gruppe aussen
# vor, und kein Test startet je einen Browser.
#     uv sync --group hotels && uv run playwright install chromium
hotels = [
    "playwright>=1.49",
]

[project.scripts]
flightopt = "flightopt.cli:main"
[tool.pytest.ini_options]
asyncio_mode = "auto"
